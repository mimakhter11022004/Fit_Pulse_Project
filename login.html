<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | FitPulse</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <a href="index.html" class="logo">FitPulse</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="services.html">Services</a></li>
    </ul>
    <a href="login.html" class="btn btn-outline btn-small">Start now &rarr;</a>
    <a href="login.html" class="login-btn">Login</a>
  </header>

  <main class="container">
    <h1 class="page-title">Welcome to <span>FitPulse</span></h1>
    <p class="subtitle">Log in to start your fitness journey.</p>

    <form class="card form-card" id="login-form">
      <label for="email">Email</label>
      <input type="text" id="email" placeholder="you@example.com">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 6 characters">

      <button class="btn btn-primary" type="submit">Login</button>

      <p class="result" id="message"></p>
    </form>

    <p class="subtitle" style="margin-top: 20px; font-size: 15px;">This is a demo form. Nothing is saved or sent anywhere.</p>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    &copy; 2026 FitPulse - a university HTML, CSS and JavaScript project. General fitness information, not medical advice.
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
