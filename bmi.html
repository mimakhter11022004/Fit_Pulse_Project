<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator | FitPulse</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <a href="index.html" class="logo">FitPulse</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="services.html" class="active">Services</a></li>
    </ul>
    <a href="login.html" class="btn btn-outline btn-small">Start now &rarr;</a>
    <a href="login.html" class="login-btn">Login</a>
  </header>

  <main class="container">
    <h1 class="page-title">BMI <span>calculator</span></h1>
    <p class="subtitle">Body mass index compares your weight with your height.</p>

    <div class="card form-card">
      <label for="height">Height (cm)</label>
      <input type="number" id="height" placeholder="e.g. 170">

      <label for="weight">Weight (kg)</label>
      <input type="number" id="weight" placeholder="e.g. 65">

      <button class="btn btn-primary" id="calculate">Calculate BMI</button>

      <p class="result" id="output"></p>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    &copy; 2026 FitPulse - a university HTML, CSS and JavaScript project. General fitness information, not medical advice.
  </footer>

  <script src="js/bmi.js"></script>
</body>
</html>
