<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calorie Calculator | FitPulse</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <a href="index.html" class="logo">FitPulse</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="services.html" class="active">Services</a></li>
    </ul>
    <a href="login.html" class="btn btn-outline btn-small">Start now &rarr;</a>
    <a href="login.html" class="login-btn">Login</a>
  </header>

  <main class="container">
    <h1 class="page-title">Calorie <span>calculator</span></h1>
    <p class="subtitle">Estimate how many calories you need every day.</p>

    <div class="card form-card">
      <label for="age">Age (years)</label>
      <input type="number" id="age" placeholder="e.g. 22">

      <label for="gender">Gender</label>
      <select id="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>

      <label for="height">Height (cm)</label>
      <input type="number" id="height" placeholder="e.g. 170">

      <label for="weight">Weight (kg)</label>
      <input type="number" id="weight" placeholder="e.g. 65">

      <label for="activity">Activity level</label>
      <select id="activity">
        <option value="1.2">Little or no exercise</option>
        <option value="1.375">Light exercise (1-3 days a week)</option>
        <option value="1.55">Moderate exercise (3-5 days a week)</option>
        <option value="1.725">Hard exercise (6-7 days a week)</option>
      </select>

      <label for="goal">Goal</label>
      <select id="goal">
        <option value="lose">Lose weight</option>
        <option value="keep">Stay fit</option>
        <option value="gain">Gain muscle</option>
      </select>

      <button class="btn btn-primary" id="calculate">Calculate calories</button>

      <p class="result" id="output"></p>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    &copy; 2026 FitPulse - a university HTML, CSS and JavaScript project. General fitness information, not medical advice.
  </footer>

  <script src="js/calories.js"></script>
</body>
</html>
